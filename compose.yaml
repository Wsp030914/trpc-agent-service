services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trpc_agent_service
      POSTGRES_USER: trpc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trpc -d trpc_agent_service"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  qdrant:
    image: qdrant/qdrant:v1.16.0
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:56333:6333"
      - "127.0.0.1:56334:6334"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  # Observability must not sit on the request/execution critical path. The
  # application falls back to no-op telemetry if this optional service is down.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=file:/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:14269/"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.53.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/otel/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      otel-collector:
        condition: service_healthy

  gateway:
    build: .
    environment:
      TRPC_AGENT_SERVICE_ROLE: gateway
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}

      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_DISPATCHER_ID: gateway-1
      TRPC_AGENT_SERVICE_ADMIN_TOKEN: ${TRPC_AGENT_SERVICE_ADMIN_TOKEN:?set TRPC_AGENT_SERVICE_ADMIN_TOKEN in .env}
      TRPC_AGENT_SERVICE_OTEL_PROTOCOL: ${TRPC_AGENT_SERVICE_OTEL_PROTOCOL:-grpc}
      TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_MODEL_PRICING: ${TRPC_AGENT_SERVICE_MODEL_PRICING:-}
      TRPC_AGENT_SERVICE_MODEL_TIMEOUT: ${TRPC_AGENT_SERVICE_MODEL_TIMEOUT:-1m}
      TRPC_AGENT_SERVICE_WORKER_CONCURRENCY: ${TRPC_AGENT_SERVICE_WORKER_CONCURRENCY:-4}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: '${TRPC_AGENT_SERVICE_COS_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: '${TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS: '${TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS:-{}}'
      TRPC_AGENT_SERVICE_HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker-1:
    build: .
    init: true
    environment:
      TRPC_AGENT_SERVICE_ROLE: worker
      TRPC_AGENT_SERVICE_WORKER_ID: worker-1
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}
      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: '${TRPC_AGENT_SERVICE_COS_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: '${TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS: '${TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS:-{}}'
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631:-}
      TRPC_AGENT_SERVICE_OTEL_PROTOCOL: ${TRPC_AGENT_SERVICE_OTEL_PROTOCOL:-grpc}
      TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_MODEL_PRICING: ${TRPC_AGENT_SERVICE_MODEL_PRICING:-}
      TRPC_AGENT_SERVICE_MODEL_TIMEOUT: ${TRPC_AGENT_SERVICE_MODEL_TIMEOUT:-1m}
      TRPC_AGENT_SERVICE_WORKER_CONCURRENCY: ${TRPC_AGENT_SERVICE_WORKER_CONCURRENCY:-4}
      TRPC_AGENT_SERVICE_HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker-2:
    build: .
    init: true
    environment:
      TRPC_AGENT_SERVICE_ROLE: worker
      TRPC_AGENT_SERVICE_WORKER_ID: worker-2
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}
      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: '${TRPC_AGENT_SERVICE_COS_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: '${TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS: '${TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS:-{}}'
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631:-}
      TRPC_AGENT_SERVICE_OTEL_PROTOCOL: ${TRPC_AGENT_SERVICE_OTEL_PROTOCOL:-grpc}
      TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_MODEL_PRICING: ${TRPC_AGENT_SERVICE_MODEL_PRICING:-}
      TRPC_AGENT_SERVICE_MODEL_TIMEOUT: ${TRPC_AGENT_SERVICE_MODEL_TIMEOUT:-1m}
      TRPC_AGENT_SERVICE_WORKER_CONCURRENCY: ${TRPC_AGENT_SERVICE_WORKER_CONCURRENCY:-4}
      TRPC_AGENT_SERVICE_HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  prometheus-data:
