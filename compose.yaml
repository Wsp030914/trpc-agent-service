services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trpc_agent_service
      POSTGRES_USER: trpc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.16.0
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6334'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  gateway:
    build: .
    environment:
      TRPC_AGENT_SERVICE_ROLE: gateway
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}

      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_DISPATCHER_ID: gateway-1
      TRPC_AGENT_SERVICE_ADMIN_TOKEN: ${TRPC_AGENT_SERVICE_ADMIN_TOKEN:?set TRPC_AGENT_SERVICE_ADMIN_TOKEN in .env}
      TRPC_AGENT_SERVICE_HEALTH_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker-1:
    build: .
    init: true
    environment:
      TRPC_AGENT_SERVICE_ROLE: worker
      TRPC_AGENT_SERVICE_WORKER_ID: worker-1
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}
      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: ${TRPC_AGENT_SERVICE_COS_ENDPOINTS:?set TRPC_AGENT_SERVICE_COS_ENDPOINTS in .env}
      TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: ${TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS:?set TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS in .env}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631:?set COS credentials in .env}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631:?set Qdrant API key in .env}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631:?set DashScope API key in .env}
      TRPC_AGENT_SERVICE_HEALTH_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker-2:
    build: .
    init: true
    environment:
      TRPC_AGENT_SERVICE_ROLE: worker
      TRPC_AGENT_SERVICE_WORKER_ID: worker-2
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}
      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: ${TRPC_AGENT_SERVICE_COS_ENDPOINTS:?set TRPC_AGENT_SERVICE_COS_ENDPOINTS in .env}
      TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: ${TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS:?set TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS in .env}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631:?set COS credentials in .env}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631:?set Qdrant API key in .env}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631:?set DashScope API key in .env}
      TRPC_AGENT_SERVICE_HEALTH_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
