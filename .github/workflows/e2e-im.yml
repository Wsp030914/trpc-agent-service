name: IM E2E

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to exercise
        required: true
        type: choice
        options:
          - feishu
          - wecom

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: im-e2e
    outputs:
      configured: ${{ steps.configuration.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - name: inspect provider-confirmed test configuration
        id: configuration
        env:
          PROVIDER: ${{ inputs.provider }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          WECOM_BOT_ID: ${{ secrets.WECOM_BOT_ID }}
          WECOM_BOT_SECRET: ${{ secrets.WECOM_BOT_SECRET }}
          BASE_URL: ${{ secrets.TRPC_AGENT_SERVICE_IM_E2E_BASE_URL }}
          CONFIRMATION_URL: ${{ secrets.TRPC_AGENT_SERVICE_IM_E2E_CONFIRMATION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          configured=false
          if [ "$PROVIDER" = feishu ]; then
            if [ -n "$FEISHU_APP_ID" ] && [ -n "$FEISHU_APP_SECRET" ]; then
              configured=true
            fi
          elif [ "$PROVIDER" = wecom ]; then
            if [ -n "$WECOM_BOT_ID" ] && [ -n "$WECOM_BOT_SECRET" ]; then
              configured=true
            fi
          fi
          if [ "$configured" = true ] && [ -n "$BASE_URL" ] && [ -n "$CONFIRMATION_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::IM E2E configuration is present; the provider-confirmed job will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::IM E2E=SKIPPED: provider credentials and/or confirmation runner configuration is absent."
          fi

  e2e:
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    environment: im-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run provider-confirmed E2E
        env:
          PROVIDER: ${{ inputs.provider }}
          BASE_URL: ${{ secrets.TRPC_AGENT_SERVICE_IM_E2E_BASE_URL }}
          CONFIRMATION_URL: ${{ secrets.TRPC_AGENT_SERVICE_IM_E2E_CONFIRMATION_URL }}
          RUNNER_TOKEN: ${{ secrets.TRPC_AGENT_SERVICE_IM_E2E_RUNNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/im-e2e \
            --provider "$PROVIDER" \
            --base-url "$BASE_URL" \
            --confirmation-url "$CONFIRMATION_URL" \
            --api-key "$RUNNER_TOKEN" \
            --message "trpc-agent-service IM hardening E2E ${GITHUB_RUN_ID}" \
            --timeout 5m

  report:
    if: ${{ always() }}
    needs: [preflight, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: publish result
        env:
          CONFIGURED: ${{ needs.preflight.outputs.configured }}
          E2E_RESULT: ${{ needs.e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$E2E_RESULT" = failure ] || [ "$E2E_RESULT" = cancelled ]; then
            echo "IM E2E=FAIL ($E2E_RESULT)"
            exit 1
          fi
          if [ "$CONFIGURED" != true ]; then
            echo "IM E2E=SKIPPED (real provider credentials or confirmation runner not configured)"
            exit 0
          fi
          if [ "$E2E_RESULT" != success ]; then
            echo "IM E2E=FAIL (unexpected result: $E2E_RESULT)"
            exit 1
          fi
          echo "IM E2E=PASS (provider event and provider-confirmed reply)"
