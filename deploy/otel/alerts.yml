groups:
  - name: trpc-agent-service-control-plane
    interval: 15s
    rules:
      - alert: TRPCAgentNoHealthyWorker
        expr: max(trpc_agent_service_worker_count) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No healthy worker is available
          description: The control plane has observed no READY worker for at least two minutes.

      - alert: TRPCAgentQueueLagHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(trpc_agent_service_queue_lag_bucket[5m]))) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Queue lag is high
          description: The p95 execution queue wait has exceeded 30 seconds for five minutes.

      - alert: TRPCAgentPostgresUnavailable
        expr: min(trpc_agent_service_backend_ready{provider="postgres"}) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL is unavailable
          description: The service control plane cannot confirm PostgreSQL readiness.

      - alert: TRPCAgentRedisUnavailable
        expr: min(trpc_agent_service_backend_ready{provider="redis"}) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis is unavailable
          description: The service control plane cannot confirm Redis readiness.

      - alert: TRPCAgentReplyFailureHigh
        expr: sum(rate(trpc_agent_service_im_reply_failure_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Reply delivery failures are high
          description: Reply delivery failures exceed 0.1 events per second for five minutes.

      - alert: TRPCAgentAuditBacklog
        expr: max(trpc_agent_service_audit_backlog) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Audit backlog is non-zero
          description: Audit delivery backlog has remained non-zero for five minutes.

      - alert: TRPCAgentMigrationStuck
        expr: max(trpc_agent_service_migration_stuck) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A data migration is stuck
          description: At least one migration has not advanced for five minutes.

      - alert: TRPCAgentIMDeliveryFailureSpike
        expr: |
          sum(rate(trpc_agent_service_im_reply_failure_total[5m]))
            /
          clamp_min(
            sum(rate(trpc_agent_service_im_reply_success_total[5m]))
            + sum(rate(trpc_agent_service_im_reply_failure_total[5m])), 1
          ) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: IM delivery failure ratio is high
          description: More than 20 percent of observed IM replies have failed for five minutes.
